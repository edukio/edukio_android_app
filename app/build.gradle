plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStorePassword = System.getenv("EDUKIO_STORE_PASSWORD")
def releaseKeyPassword = System.getenv("EDUKIO_KEY_PASSWORD")

if (releaseRequested) {
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException(
            "Arquivo keystore.properties não encontrado. Copie keystore.properties.example para keystore.properties e informe storeFile e keyAlias."
        )
    }

    if (!keystoreProperties['storeFile'] || !keystoreProperties['keyAlias']) {
        throw new GradleException(
            "keystore.properties precisa conter storeFile e keyAlias."
        )
    }

    if (!releaseStorePassword || !releaseKeyPassword) {
        throw new GradleException(
            "As senhas de assinatura não foram informadas. Gere a release pelas tarefas do VS Code para que elas sejam solicitadas."
        )
    }
}

android {
    namespace 'com.edukio.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.edukio.app'
        minSdk 26
        targetSdk 36
        versionCode 23
        versionName '2.3'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (
                keystorePropertiesFile.exists() &&
                keystoreProperties['storeFile'] &&
                keystoreProperties['keyAlias'] &&
                releaseStorePassword &&
                releaseKeyPassword
            ) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword releaseStorePassword
                keyAlias keystoreProperties['keyAlias']
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'androidx.core:core-ktx:1.7.0'
    // OnBackPressedDispatcher compatível com a navegação preditiva do Android 16.
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.webkit:webkit:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.1'
}
